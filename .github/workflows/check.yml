name: Check mod sources

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  osiris:
    name: Check Osiris database types
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check Osiris goals
        run: python tools/check_osiris_database_types.py
