name: Package mod

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LSLIB_VERSION: v1.20.4
  LSLIB_SHA256: 5e02368fb8acafda9b45acba37a3f3bf507fc3d65a083a159abbeab06337190e

jobs:
  package:
    name: Build packages
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.7.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download pinned LSLib
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archive = Join-Path $env:RUNNER_TEMP "ExportTool-$env:LSLIB_VERSION.zip"
          $url = "https://github.com/Norbyte/lslib/releases/download/$env:LSLIB_VERSION/ExportTool-$env:LSLIB_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive

          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:LSLIB_SHA256) {
            throw "LSLib checksum mismatch. Expected $env:LSLIB_SHA256, got $actualHash."
          }

          Expand-Archive -Path $archive -DestinationPath (Join-Path $env:RUNNER_TEMP "lslib")

      - name: Stage game files
        run: pnpm run stage

      - name: Create packages
        run: pnpm run package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: bg3-pak
          path: |
            dist/*.pak
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: bg3-pak
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.pak dist/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.pak dist/*.sha256 \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
